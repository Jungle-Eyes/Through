<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>直升机第一人称</title>
<style>
:root{color-scheme:dark;--heli:#ffc233;--ink:#f6f1e7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0e0e22;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 6%);display:flex;justify-content:space-between;padding:0 22px;font-size:17px;font-weight:700;pointer-events:none;text-shadow:0 1px 4px #000a}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#0e0e22b3}
#ov.start{background:rgba(5,8,20,.28)}
#ov.start h1,#ov.start p{text-shadow:0 2px 10px #000b}
#ov h1{font-size:38px;margin:0 0 10px;letter-spacing:2px}
#ov p{margin:4px 0;font-size:17px;opacity:.9}
#ov b{display:inline-block;margin-top:22px;padding:12px 30px;border-radius:999px;background:var(--heli);color:#1a1a1a;font-size:18px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="s">积分 0</span><span id="b">最高积分 0</span></div>
<div id="ov" class="start"><h1>驾驶直升机</h1><p>手指按住屏幕任意位置，当摇杆拖动</p><p>上下拖：升降　左右拖：转向　松手：悬停</p><p>按住不动，橘色点在圆心：加速</p><p>碰矿石或宝石得 1 积分，躲开魔鬼和洞壁</p><b>点击起飞</b></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),ov=document.getElementById('ov'),sEl=document.getElementById('s'),bEl=document.getElementById('b');
let W,H,F,F0,Hc,best=0;
try{best=+localStorage.getItem('heli-fpv-best2')||0}catch(e){}
const START_HTML=ov.innerHTML;
bEl.textContent='最高积分 '+best;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);F0=F=Math.max(W,H*.55)*.95;Hc=H*.42}
addEventListener('resize',rs);rs();

// 世界参数
const D=50,N=34,Z0=40;
const hash=k=>{let h=Math.imul(k,374761393)+668265263|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295};
const amp=s=>Math.min(1,s/2500);
const cx=s=>amp(s)*(Math.sin(s*.0005)*330+Math.sin(s*.0012+1.3)*130);
const cy=s=>amp(s)*(Math.sin(s*.0007+.7)*170+Math.sin(s*.0017+2.1)*70);
const hw=s=>Math.max(95,230-s*.0035);
const hh=s=>hw(s)*.72;
const lvlAt=s=>1+Math.floor(s/12000);
function obstacle(k){
  const s=k*D,L=lvlAt(s),thr=Math.min(.18,.07+.02*(L-1));
  if(k<30||hash(k)>thr)return null;
  for(let j=1;j<=5;j++)if(hash(k-j)<=thr)return null;
  const w=hw(s),h=hh(s),sz=w*.42,mv=L>=2&&hash(k+21)<.4;
  return{x:mv?cx(s)+Math.sin(tm*1.6+k)*(w-sz)*.8:cx(s)+(hash(k+7)-.5)*(w-sz)*1.6,y:cy(s)+(hash(k+13)-.5)*(h-sz)*1.6,r:sz/2,mv};
}
function coin(k){
  if(k<25||obstacle(k))return null;
  const s=k*D,w=hw(s),h=hh(s);
  if(hash(k+601)<.035)return{x:cx(s)+(hash(k+602)-.5)*w*1.1,y:cy(s)+(hash(k+603)-.5)*h*1.0,r:16,gem:true,ci:Math.floor(hash(k+604)*4)};
  const g=Math.floor(k/10),r=k%10;
  if(hash(g+900)>.4||r<3||r>7)return null;
  return{x:cx(s)+(hash(g+910)-.5)*w*1.1,y:cy(s)+(hash(g+911)-.5)*h*1.0,r:14};
}

// 状态
let state='idle',S=0,px=0,py=0,vx=0,vy=0,roll=0,lastK=0,tm=0,last=0,overAt=0;
let ph=false,ts=0,tv=0,sx0=0,sy0=0,sp=420,ku=0,kd=0,kl=0,kr=0,ax=0,ay=0,pitch=0;
let danger=0,hitT=0,cseed=0,dtG=.016,boomT=0,lastCeil=false,sparks=[],coins=0,gems=0,coinCol='255,255,255',introT=0,lvl=1,lvlT=0,coinT=0,lastBeep=0,boost=0,holdC=0,dsp=420,vs=0;
const score=()=>coins+gems;
function begin(){S=0;px=0;py=0;vx=0;vy=0;roll=0;lastK=0;ax=0;ay=0;pitch=0;danger=0;lvl=1;lvlT=0;state='play'}
function start(){S=0;px=0;py=0;vx=0;vy=0;roll=0;lastK=0;ax=0;ay=0;pitch=0;danger=0;hitT=0;coins=0;gems=0;lvl=1;lvlT=0;lastBeep=0;boost=0;holdC=0;introT=3;sEl.textContent='积分 0';state='intro';ov.style.display='none'}
let AC=null,eng=null,muted=false;
function initAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(AC){if(AC.state!=='running')AC.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  AC=new C();AC.resume();
  const ub=AC.createBuffer(1,1,22050),us=AC.createBufferSource();us.buffer=ub;us.connect(AC.destination);us.start(0);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;lp.Q.value=.4;lp.connect(AC.destination);
  const master=AC.createGain();master.gain.value=muted?0:.8;master.connect(lp);AC.master=master;
  const g=AC.createGain();g.gain.value=0;g.connect(master);
  const tg=AC.createGain();tg.gain.value=.6;tg.connect(g);
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=600;f.connect(tg);
  const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=85;o.connect(f);o.start();
  const lfo=AC.createOscillator();lfo.frequency.value=12;const lg=AC.createGain();lg.gain.value=.4;lfo.connect(lg);lg.connect(tg.gain);lfo.start();
  const nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const ns=AC.createBufferSource();ns.buffer=nb;ns.loop=true;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=.8;
  const ng=AC.createGain();ng.gain.value=.25;ns.connect(bp);bp.connect(ng);ng.connect(g);ns.start();
  eng={g,o,lfo};
}
function engineTick(on){
  if(!AC||!eng)return;
  const t=AC.currentTime;
  eng.g.gain.setTargetAtTime(on?.22:0,t,.1);
  if(on){eng.o.frequency.setTargetAtTime(82+(sp-420)*.05+ay*10,t,.1);eng.lfo.frequency.setTargetAtTime(11+sp/70,t,.2)}
}
function tone(freq,dur,type,vol,delay,slide){
  if(!AC||muted)return;const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(AC.master);o.start(t);o.stop(t+dur+.02);
}
function sndLevel(){[523,659,784,1047].forEach((f,i)=>tone(f*.7,.2,'triangle',.14,i*.11))}
function sndBeep(){tone(620,.09,'triangle',.1)}
function sndBoom(){
  if(!AC)return;const t=AC.currentTime,rate=AC.sampleRate;
  const mk=(dur,pw)=>{const len=Math.floor(rate*dur),buf=AC.createBuffer(1,len,rate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,pw);
    const n=AC.createBufferSource();n.buffer=buf;return n};
  {const n=mk(.12,3),f=AC.createBiquadFilter(),g=AC.createGain();f.type='highpass';f.frequency.value=400;
   g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);n.connect(f);f.connect(g);g.connect(AC.master);n.start(t)}
  {const n=mk(3.6,1.6),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';
   f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(55,t+3.2);
   g.gain.setValueAtTime(.26,t);g.gain.exponentialRampToValueAtTime(.001,t+3.6);n.connect(f);f.connect(g);g.connect(AC.master);n.start(t)}
  tone(120,1.8,'sine',.3,0,40);
  {const n=mk(4.2,1.2),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=160;
   g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.11,t+.5);g.gain.exponentialRampToValueAtTime(.001,t+4.2);
   n.connect(f);f.connect(g);g.connect(AC.master);n.start(t)}
}
['pointerup','touchend','click'].forEach(ev=>addEventListener(ev,initAudio));
function die(ceil){
  state='boom';boomT=0;hitT=1.4;danger=0;lastCeil=!!ceil;cseed=Math.floor(Math.random()*1e6);
  ph=false;ts=0;tv=0;ku=0;kd=0;kl=0;kr=0;boost=0;holdC=0;
  const m=score();sndBoom();
  if(m>best){best=m;try{localStorage.setItem('heli-fpv-best2',best)}catch(e){}}
  bEl.textContent='最高积分 '+best;
  sparks=Array.from({length:70},()=>({a:Math.random()*6.2832,v:120+Math.random()*420,s:1.5+Math.random()*3.5,c:Math.random()}));
}
function showOver(){ov.className='';
  state='over';overAt=performance.now();
  ov.innerHTML='<h1>'+(lastCeil?'损坏了':'坠毁了')+'</h1><p>积分 '+score()+'</p><p>最高积分 '+best+'</p><b>点击继续</b>';
  ov.style.display='flex';
}
function toStart(){
  S=0;px=0;py=0;vx=0;vy=0;roll=0;lastK=0;ax=0;ay=0;pitch=0;danger=0;hitT=0;coins=0;gems=0;lvl=1;lvlT=0;sEl.textContent='积分 0';
  ov.innerHTML=START_HTML;ov.className='start';state='idle';
}
function canStart(){return state==='idle'||performance.now()-overAt>400}
const R=64,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dz=v=>{const m=Math.abs(v);return m<.1?0:Math.sign(v)*(m-.1)/.9};
addEventListener('pointerdown',e=>{e.preventDefault();initAudio();if(state==='boom')return;if(state==='over'){if(canStart())toStart();return}if(state==='idle')start();ph=true;sx0=e.clientX;sy0=e.clientY;ts=0;tv=0});
addEventListener('pointermove',e=>{if(ph){ts=clamp((e.clientX-sx0)/R,-1,1);tv=clamp((sy0-e.clientY)/R,-1,1)}});
const rel=()=>{ph=false;ts=0;tv=0};
addEventListener('pointerup',rel);addEventListener('pointercancel',rel);
const KU=['ArrowUp','KeyW','Space'],KD=['ArrowDown','KeyS'],KL=['ArrowLeft','KeyA'],KR=['ArrowRight','KeyD'];
addEventListener('keydown',e=>{
  const k=e.code;initAudio();
  if([...KU,...KD,...KL,...KR].includes(k)){e.preventDefault();if(state==='boom')return;if(state==='over'){if(canStart())toStart();return}if(state==='idle')start();}
  if(KU.includes(k))ku=1;if(KD.includes(k))kd=1;if(KL.includes(k))kl=1;if(KR.includes(k))kr=1;
});
addEventListener('keyup',e=>{
  const k=e.code;
  if(KU.includes(k))ku=0;if(KD.includes(k))kd=0;if(KL.includes(k))kl=0;if(KR.includes(k))kr=0;
});

function update(dt){
  const cen=ph&&Math.abs(ts)<.18&&Math.abs(tv)<.18;
  holdC=cen?holdC+dt:0;
  const bt=holdC>.3?1:0;
  boost+=(bt-boost)*Math.min(1,dt*(bt?1.5:3));
  sp=(420+Math.min(S/60,320))*(1+.4*boost);
  S+=sp*dt;
  const inX=clamp(dz(ts)+kr-kl,-1,1),inY=clamp(dz(tv)+ku-kd,-1,1);
  ax+=(inX-ax)*Math.min(1,dt*9);ay+=(inY-ay)*Math.min(1,dt*9);
  vx+=(ax*330-vx)*Math.min(1,dt*3.2);
  vy+=(ay*250-vy)*Math.min(1,dt*3.2);
  px+=vx*dt;py+=vy*dt;
  roll+=(vx/330*.16+(cx(S+80)-cx(S))/80*.35-roll)*Math.min(1,dt*5);
  pitch+=(vy/250+(cy(S+80)-cy(S))/80*1.2-pitch)*Math.min(1,dt*4);
  const dyc=py-cy(S),side=Math.abs(px-cx(S))>hw(S)-16;
  if(side||Math.abs(dyc)>hh(S)-16){die(side||dyc>hh(S)-16);return}
  danger=clamp(1-Math.min(hw(S)-16-Math.abs(px-cx(S)),hh(S)-16-Math.abs(dyc))/45,0,1);
  if(danger>.6&&tm-lastBeep>.28){lastBeep=tm;sndBeep()}
  const k=Math.floor(S/D);
  if(k!==lastK){
    lastK=k;const o=obstacle(k);
    if(o&&Math.abs(px-o.x)<o.r+16&&Math.abs(py-o.y)<o.r+16){die();return}
    const cn=coin(k);
    if(cn&&Math.abs(px-cn.x)<cn.r+22&&Math.abs(py-cn.y)<cn.r+22){if(cn.gem){gems++;coinT=1;coinCol='120,255,220'}else{coins++;coinT=.6;coinCol='170,185,255'}}
  }
  const nl=lvlAt(S);
  if(nl!==lvl){lvl=nl;lvlT=3;sndLevel()}
  sEl.textContent='积分 '+score();
}

// 绘制
const CEIL=[58,70,120],FLOOR=[46,96,60],WALL=[74,60,112],OBS=[239,71,111];
const TINT=[[1,1,1],[.7,1.15,1.1],[1.25,.85,.8],[.95,.8,1.3],[1.15,1.1,.75]];
function col(b,k,t){
  const m=(k&1)?1:.66,f=Math.pow(t,.75),T=(b===CEIL||b===WALL)?TINT[(lvl-1)%5]:[1,1,1];
  return'rgb('+((b[0]*T[0]*m*(1-f)+14*f)|0)+','+((b[1]*T[1]*m*(1-f)+14*f)|0)+','+((b[2]*T[2]*m*(1-f)+34*f)|0)+')';
}
function quad(a,b,c2,d,fill){
  x.fillStyle=fill;x.strokeStyle=fill;x.lineWidth=1;
  x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.lineTo(c2[0],c2[1]);x.lineTo(d[0],d[1]);x.closePath();x.fill();x.stroke();
}
const STARS=Array.from({length:260},(_,i)=>({a:hash(i*3+1)*6.2832,z:hash(i*3+2),c:i%9}));
function ore(sx,sy,r,k,t){
  const rot=tm*1.4+k,n=7;
  x.fillStyle=col([140,150,220],k,t);x.globalAlpha=.18*(1-t*.8);x.beginPath();x.arc(sx,sy,r*1.7,0,7);x.fill();x.globalAlpha=1;
  x.beginPath();
  for(let i=0;i<n;i++){const a=rot+i*6.2832/n,rr=r*(.75+.35*hash(k*7+i)),ox=sx+Math.cos(a)*rr,oy=sy+Math.sin(a)*rr*.9;i?x.lineTo(ox,oy):x.moveTo(ox,oy)}
  x.closePath();x.fillStyle=col([22,22,30],k,t);x.fill();
  x.strokeStyle=col([120,130,180],k,t);x.lineWidth=Math.max(1,r*.12);x.stroke();
  x.fillStyle=col([210,220,255],k,t);x.globalAlpha=.8;x.beginPath();x.arc(sx-r*.3,sy-r*.35,Math.max(.8,r*.16),0,7);x.fill();x.globalAlpha=1;
}
const GC=[[80,230,255],[255,90,200],[110,255,140],[255,220,90]];
function gem(sx,sy,r,k,t,ci){
  const c=GC[ci],tw=.5+.5*Math.sin(tm*4+k);
  x.fillStyle=col(c,k,t);x.globalAlpha=(.22+.18*tw)*(1-t*.8);x.beginPath();x.arc(sx,sy,r*2.2,0,7);x.fill();x.globalAlpha=1;
  x.beginPath();x.moveTo(sx,sy-r*1.1);x.lineTo(sx+r*.9,sy-r*.2);x.lineTo(sx,sy+r*1.15);x.lineTo(sx-r*.9,sy-r*.2);x.closePath();
  x.fillStyle=col(c,k,t);x.fill();
  x.fillStyle=col([255,255,255],k,t);x.globalAlpha=.55;x.beginPath();x.moveTo(sx,sy-r*1.1);x.lineTo(sx+r*.9,sy-r*.2);x.lineTo(sx-r*.9,sy-r*.2);x.closePath();x.fill();x.globalAlpha=1;
  x.strokeStyle=col([255,255,255],k,t);x.lineWidth=Math.max(1,r*.1);x.beginPath();x.moveTo(sx,sy-r*1.1);x.lineTo(sx+r*.9,sy-r*.2);x.lineTo(sx,sy+r*1.15);x.lineTo(sx-r*.9,sy-r*.2);x.closePath();x.stroke();
}
function devil(sx,sy,h,t,mv){
  const EY=mv?col([235,40,40],0,t):null;
  const Wt=col([245,245,245],0,t),K=col([8,8,8],0,t);
  const P=(pts,f)=>{x.fillStyle=f;x.beginPath();pts.forEach((p,i)=>x[i?'lineTo':'moveTo'](sx+p[0]*h,sy+p[1]*h));x.closePath();x.fill()};
  P([[-.8,-.3],[-.95,-1],[-.25,-.7]],K);P([[.8,-.3],[.95,-1],[.25,-.7]],K);
  x.fillStyle=Wt;x.strokeStyle=K;x.lineWidth=Math.max(1,h*.08);
  x.beginPath();x.ellipse(sx,sy+h*.1,h*.88,h*.82,0,0,7);x.fill();x.stroke();
  P([[-.65,-.25],[-.1,.02],[-.5,.18]],EY||K);P([[.65,-.25],[.1,.02],[.5,.18]],EY||K);
  P([[-.5,.4],[.5,.4],[.35,.75],[-.35,.75]],K);
  P([[-.35,.4],[-.15,.4],[-.25,.58]],Wt);P([[-.1,.4],[.1,.4],[0,.58]],Wt);P([[.15,.4],[.35,.4],[.25,.58]],Wt);
}
function drawWorld(){
  const k0=Math.floor(S/D),P=[];
  for(let j=1;j<=N;j++){
    const k=k0+j,s=k*D,z=s-S+Z0,f=F/z,mx=cx(s)-px,my=cy(s)-py,w=hw(s),h=hh(s);
    P[j]={z,f,k,l:W/2+(mx-w)*f,r:W/2+(mx+w)*f,t:Hc-(my+h)*f,b:Hc-(my-h)*f};
  }
  const far=P[N],fx=(far.l+far.r)/2,fy=(far.t+far.b)/2,R=Math.max(W,H)*.9;
  const sg=x.createLinearGradient(0,-H*.5,0,H*1.5);
  sg.addColorStop(0,'#040820');sg.addColorStop(1,'#0b1238');
  x.fillStyle=sg;x.fillRect(-W,-H,W*3,H*3);
  // 银河带
  x.save();x.translate(fx,fy);x.rotate(-.55);x.scale(1,.3);
  const mg=x.createRadialGradient(0,0,0,0,0,R*.9);
  mg.addColorStop(0,'rgba(170,200,255,.6)');mg.addColorStop(.2,'rgba(90,140,255,.38)');mg.addColorStop(.45,'rgba(150,90,230,.24)');mg.addColorStop(.7,'rgba(60,200,220,.1)');mg.addColorStop(1,'rgba(40,30,120,0)');
  x.fillStyle=mg;x.fillRect(-R,-R,R*2,R*2);x.restore();
  x.save();x.translate(fx+R*.15,fy-R*.05);x.rotate(-.55);x.scale(1,.22);
  const ng=x.createRadialGradient(0,0,0,0,0,R*.6);
  ng.addColorStop(0,'rgba(255,120,200,.2)');ng.addColorStop(1,'rgba(255,120,200,0)');
  x.fillStyle=ng;x.fillRect(-R,-R,R*2,R*2);x.restore();
  // 星海：固定在极远处，只缓慢转动，看得见、永远够不着
  const SC=['#6fb4ff','#8fd3ff','#7a8bff','#b48aff','#5ee6d8','#ff9ad5'];
  for(let i=0;i<STARS.length;i++){
    const q=STARS[i],ang=q.a+tm*.006,r=R*Math.pow(q.z,1.5),
      sx=fx+Math.cos(ang)*r-px*.02,sy=fy+Math.sin(ang)*r+py*.02;
    if(sx<-10||sx>W+10||sy<-10||sy>H+10)continue;
    x.globalAlpha=(.35+.5*q.z)*(.7+.3*Math.sin(tm*2+i*1.7));
    x.fillStyle=q.c===8?'#ffffff':SC[q.c%6];
    x.beginPath();x.arc(sx,sy,.5+q.z*1.2,0,7);x.fill();
  }
  x.globalAlpha=1;
  x.fillStyle='#f4f1dc';x.beginPath();x.arc(W*.74-px*.02,Hc-H*.24+py*.02,W*.035,0,7);x.fill();
  for(let j=N-1;j>=1;j--){
    const a=P[j],b=P[j+1],t=j/N,k=a.k;
    x.globalAlpha=Math.max(.1,1-Math.pow(t,1.5));quad([a.l,a.t],[a.r,a.t],[b.r,b.t],[b.l,b.t],col(CEIL,k,t));x.globalAlpha=1;
    quad([a.l,a.b],[a.r,a.b],[b.r,b.b],[b.l,b.b],col(FLOOR,k,t));

        x.fillStyle=col([70,166,92],k,t);x.beginPath();x.arc(tx-4*f,fy-34*f,8*f,0,7);x.fill();
      }
    }

      }

        const left=hash(k+8)<.5,qx=left?a.l:a.r,qy=a.t+(a.b-a.t)*(.2+hash(k+9)*.6),r=10*f;

      }
    }

      const f=a.f,sx=W/2+(o.x-px)*f,sy=Hc-(o.y-py)*f,hf=o.r*f;

  }
}
function gauge(gx,gy,r,v,label){

  x.strokeStyle='#6b7194';x.lineWidth=2;

    x.beginPath();x.moveTo(gx+Math.cos(a)*r*.8,gy+Math.sin(a)*r*.8);x.lineTo(gx+Math.cos(a)*r*.93,gy+Math.sin(a)*r*.93);x.stroke();
  }

  x.strokeStyle='#ffc233';x.lineWidth=3;x.beginPath();x.moveTo(gx,gy);x.lineTo(gx+Math.cos(a)*r*.75,gy+Math.sin(a)*r*.75);x.stroke();

function rivets(x0,y0,x1,y1,n){x.fillStyle='#6b7191';for(let i=0;i<=n;i++){const u=i/n;x.beginPath();x.arc(x0+(x1-x0)*u,y0+(y1-y0)*u,Math.max(1.5,W*.005),0,7);x.fill()}}

function lg(x0,y0,x1,y1,st){const g=x.createLinearGradient(x0,y0,x1,y1);st.forEach((c,i)=>g.addColorStop(i/(st.length-1),c));return g}

const bc=document.createElement('canvas'),bx=bc.getContext('2d');let bgPh=0;
function drawTunnelBg(al){
  if(!(BG.complete&&BG.naturalWidth))return false;
  const iw=BG.naturalWidth,ih=BG.naturalHeight,cover=Math.max(W/iw,H/ih),R=3;
  const f=bgPh%1,a=Math.pow(R,f),e=f*f*(3-2*f),cy0=H*.5;
  x.save();x.globalAlpha=al;
  x.drawImage(BG,W/2-iw*cover*a/2,cy0-ih*cover*a/2,iw*cover*a,ih*cover*a);
  if(e>.01){
    if(bc.width!==c.width||bc.height!==c.height){bc.width=c.width;bc.height=c.height}
    const d=c.width/W,sc=cover*a/R,bw=iw*sc,bh=ih*sc;
    bx.setTransform(d,0,0,d,0,0);bx.globalCompositeOperation='source-over';bx.clearRect(0,0,W,H);
    bx.drawImage(BG,W/2-bw/2,cy0-bh/2,bw,bh);
    const rr=Math.min(bw,bh)/2,g=bx.createRadialGradient(W/2,cy0,0,W/2,cy0,rr);
    g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.6,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');
    bx.globalCompositeOperation='destination-in';bx.fillStyle=g;bx.fillRect(0,0,W,H);
    x.globalAlpha=al*e;x.drawImage(bc,0,0,W,H);
  }
  x.restore();return true;
}
function loop(t){
  const dt=Math.min((t-last)/1000||0,.033);last=t;tm+=dt;dtG=dt;lvlT=Math.max(0,lvlT-dt);coinT=Math.max(0,coinT-dt*2.5);engineTick(state==='play'||state==='intro');
  if(state==='play')update(dt);else if(state==='idle')S+=90*dt;else if(state==='intro'){S+=90*dt;introT-=dt;if(introT<=0)begin()}else if(state==='boom'){boomT+=dt;if(boomT>1.3)showOver()}
  hitT=Math.max(0,hitT-dt*2.2);
  vs=state==='play'?clamp((sp-300)/700,0,1.2):0;F=F0*(1-.14*vs);dsp+=((state==='play'?sp:420)-dsp)*Math.min(1,dt*6);
  x.save();
  if(hitT>0)x.translate((Math.random()-.5)*hitT*16,(Math.random()-.5)*hitT*16);
  else if(vs>.3)x.translate((Math.random()-.5)*vs*2,(Math.random()-.5)*vs*2);
  const wantBg=state==='idle'||state==='intro',fade=state==='intro'?Math.min(1,introT/.45):1;
  let bgOK=false;
  if(wantBg){bgPh+=dt/(state==='intro'?.3:.5);if(fade>=1)bgOK=drawTunnelBg(1)}
  if(!bgOK){
    const h0=Hc;Hc=h0+pitch*H*.03;
    x.save();x.translate(W/2,Hc);x.rotate(roll);x.translate(-W/2,-Hc);
    drawWorld();x.restore();Hc=h0;
    drawStreaks();
    drawCockpit();drawStick();
    if(wantBg&&fade<1)drawTunnelBg(fade);
  }
  x.restore();
  if(state==='boom'||state==='over')drawExplosion();
  if(state==='over')drawCracks();
  if(hitT>0){x.fillStyle='rgba(255,60,40,'+Math.min(.6,hitT*.45)+')';x.fillRect(0,0,W,H)}
  if(coinT>0){x.fillStyle='rgba('+coinCol+','+coinT*.12+')';x.fillRect(0,0,W,H)}
  if(state==='play')drawBanner();
  if(state==='intro')drawIntro();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
